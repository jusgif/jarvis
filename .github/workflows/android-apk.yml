name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # Use the repository's Firebase config when supplied as a secret.
      # Otherwise create a CI-only placeholder: Firebase-backed features won't work
      # in an APK built with the placeholder configuration.
      - name: Configure Google Services for CI
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "ci-placeholder-project",
              "storage_bucket": "ci-placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:0123456789abcdef",
                  "android_client_info": { "package_name": "com.blurr.voice" }
                },
                "oauth_client": [
                  {
                    "client_id": "1234567890-ci-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [{ "current_key": "AIzaSyDUMMY_CI_ONLY_NOT_A_REAL_KEY" }]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
